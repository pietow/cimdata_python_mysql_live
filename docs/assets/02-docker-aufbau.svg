<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">MySQL mit Docker Desktop unter Windows</title><desc id="desc">Windows erreicht MySQL über Port 3307. Im Container läuft MySQL auf Port 3306. Das benannte Volume bewahrt die Daten.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#222"><text x="30" y="50" font-size="32" font-weight="bold">Wo laufen Client, Server und Daten?</text><rect x="20" y="80" width="1160" height="575" rx="10" fill="white" stroke="#222" stroke-width="2.5"/><text x="40" y="115" font-size="26" font-weight="bold">Windows</text><rect x="520" y="140" width="610" height="440" rx="10" fill="white" stroke="#222" stroke-width="2.5"/><text x="545" y="175" font-size="26" font-weight="bold">Docker Desktop / WSL 2</text><rect x="50" y="185" width="340" height="105" rx="10" fill="white" stroke="#222" stroke-width="2.5"/><text x="70" y="220" font-size="22" font-weight="normal">Lokaler Client (später Python)</text><text x="70" y="260" font-size="24" font-weight="bold">127.0.0.1:3307</text><rect x="650" y="220" width="360" height="65" rx="10" fill="white" stroke="#222" stroke-width="2.5"/><text x="670" y="260" font-size="21" font-weight="normal">mysql-Client via compose exec</text><rect x="650" y="335" width="360" height="95" rx="10" fill="white" stroke="#222" stroke-width="2.5"/><text x="670" y="370" font-size="24" font-weight="bold">Dienst db: MySQL-Server</text><text x="670" y="410" font-size="22" font-weight="normal">Container-Port 3306</text><path d="M 830 285 L 830 335" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 390 260 L 625 365" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/><text x="410" y="275" font-size="19" font-weight="normal">Portfreigabe</text><rect x="50" y="340" width="340" height="75" rx="10" fill="white" stroke="#222" stroke-width="2.5"/><text x="70" y="385" font-size="23" font-weight="normal">Image: mysql:8.4.10</text><path d="M 390 390 L 640 390" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/><text x="425" y="422" font-size="18" font-weight="normal">Vorlage</text><rect x="650" y="475" width="360" height="65" rx="10" fill="white" stroke="#222" stroke-width="2.5"/><text x="670" y="515" font-size="24" font-weight="bold">Volume: mysql_data</text><path d="M 830 430 L 830 475" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="470" width="340" height="65" rx="10" fill="white" stroke="#222" stroke-width="2.5"/><text x="70" y="510" font-size="21" font-weight="normal">compose.yaml beschreibt db</text><text x="40" y="620" font-size="22" font-weight="normal">stop: Container bleibt. down: Container geht. Das benannte Volume bleibt.</text></g></svg>
