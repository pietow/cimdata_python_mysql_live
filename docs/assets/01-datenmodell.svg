<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Hogwarts: Schüler, Buchungen und Kurse</title><desc id="desc">Zwei 1:n-Beziehungen verbinden Schüler und Kurse über Buchungen. PK steht für Primärschlüssel, FK für Fremdschlüssel.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#222"><text x="40" y="55" font-size="32" font-weight="bold">Wer hat welchen Kurs gebucht?</text><rect x="40" y="130" width="320" height="310" rx="10" fill="white" stroke="#222" stroke-width="2.5"/><text x="60" y="175" font-size="28" font-weight="bold">students</text><path d="M 40 195 H 360" stroke="#222" stroke-width="2"/><text x="60" y="235" font-size="22" font-weight="normal">id [PK]</text><text x="60" y="277" font-size="22" font-weight="normal">first_name</text><text x="60" y="319" font-size="22" font-weight="normal">last_name</text><text x="60" y="361" font-size="22" font-weight="normal">house</text><text x="60" y="403" font-size="22" font-weight="normal">school_year</text><rect x="440" y="130" width="320" height="310" rx="10" fill="white" stroke="#222" stroke-width="2.5"/><text x="460" y="175" font-size="28" font-weight="bold">bookings</text><path d="M 440 195 H 760" stroke="#222" stroke-width="2"/><text x="460" y="235" font-size="22" font-weight="normal">id [PK]</text><text x="460" y="277" font-size="22" font-weight="normal">student_id [FK]</text><text x="460" y="319" font-size="22" font-weight="normal">course_id [FK]</text><text x="460" y="361" font-size="22" font-weight="normal">booking_date</text><rect x="840" y="130" width="320" height="310" rx="10" fill="white" stroke="#222" stroke-width="2.5"/><text x="860" y="175" font-size="28" font-weight="bold">courses</text><path d="M 840 195 H 1160" stroke="#222" stroke-width="2"/><text x="860" y="235" font-size="22" font-weight="normal">id [PK]</text><text x="860" y="277" font-size="22" font-weight="normal">title</text><path d="M 360 235 L 400 235 L 400 277 L 440 277" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 840 235 L 800 235 L 800 319 L 760 319" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/><text x="373" y="220" font-size="18" font-weight="normal">1:n</text><text x="774" y="355" font-size="18" font-weight="normal">n:1</text><text x="40" y="490" font-size="22" font-weight="normal">PK = eindeutige Zeile. FK = Verweis auf eine vorhandene Zeile.</text><rect x="40" y="520" width="1120" height="75" rx="10" fill="white" stroke="#222" stroke-width="2.5"/><text x="60" y="565" font-size="22" font-weight="normal">Hermione [2] → Buchung [3]: student_id = 2, course_id = 3 → Alte Runen [3]</text></g></svg>
